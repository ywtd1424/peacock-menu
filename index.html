<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محمصة ومقهى بيكوك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --cream:#EAE2D5;
  --cream-deep:#DFD3BF;
  --paper:#F6F1E6;
  --crimson:#6B433C;
  --crimson-deep:#47281F;
  --ink:#3A2620;
  --ink-soft:#8C7365;
  --line:rgba(107,67,60,.30);
  --shadow:0 10px 24px rgba(58,38,32,.10);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
/* Brand colors are fixed (cream + crimson) regardless of the
   viewer's device dark/light mode setting, so the menu always
   matches the intended identity. */
html{color-scheme:light;}

*{box-sizing:border-box;}
html,body{min-height:100%; background:var(--cream);}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:'Tajawal',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block;}

.crown{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:0 auto;
}
.crown span{
  width:5px;height:5px;border-radius:50%;
  background:var(--crimson);
  position:relative;
}
.crown span::after{
  content:"";
  position:absolute;
  bottom:5px;left:50%;
  transform:translateX(-50%);
  width:1.4px;height:11px;
  background:var(--crimson);
}
.crown span:nth-child(1){opacity:.55}
.crown span:nth-child(2){opacity:.8}
.crown span:nth-child(4){opacity:.8}
.crown span:nth-child(5){opacity:.55}

/* ---------- splash ---------- */
.splash{
  position:fixed;inset:0;
  z-index:50;
  background:var(--cream);
  display:flex;align-items:center;justify-content:center;
  padding:28px;
  padding-top:calc(28px + env(safe-area-inset-top,0px));
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  transition:opacity .55s ease, visibility .55s ease;
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
.splash-frame{
  width:100%;
  max-width:380px;
  height:min(600px, 88vh);
  display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;
  animation:riseIn .8s ease both;
}
@keyframes riseIn{
  from{opacity:0; transform:translateY(14px);}
  to{opacity:1; transform:translateY(0);}
}
.splash-rule{
  width:100%;
  display:flex;align-items:center;gap:12px;
}
.splash-rule .line{flex:1;height:1px;background:var(--line);}
.splash-rule.top{flex-direction:row-reverse;}
.rule-label{
  font-size:12px;
  letter-spacing:.03em;
  color:var(--ink-soft);
  white-space:nowrap;
  font-family:'Tajawal',sans-serif;
}
.splash-inner{
  text-align:center;
  max-width:300px;
  display:flex;flex-direction:column;align-items:center;
}
.emblem{
  width:104px;height:104px;
  border-radius:20px;
  border:1px solid var(--crimson);
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 22px;
}
.splash-logo{
  width:58px;height:58px;
  object-fit:contain;
  animation:breathe 3.4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.07);}
}
.splash-eyebrow{
  margin:0 0 8px;
  color:var(--ink-soft);
  font-size:13px;
  letter-spacing:.03em;
}
.splash-welcome{
  font-family:'Aref Ruqaa',serif;
  font-weight:700;
  font-size:50px;
  line-height:1.2;
  margin:0;
  color:var(--crimson-deep);
}
.splash-divider{
  display:block;
  width:36px;height:1px;
  background:var(--crimson);
  margin:20px 0 16px;
}
.splash-sub{
  margin:0 0 30px;
  font-size:14px;
  color:var(--ink-soft);
  letter-spacing:.04em;
}
.enter-btn{
  appearance:none;
  background:var(--crimson);
  border:1px solid var(--crimson);
  color:var(--paper);
  font-family:'Tajawal',sans-serif;
  font-weight:700;
  font-size:14.5px;
  letter-spacing:.02em;
  padding:13px 48px;
  border-radius:12px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .15s;
}
.enter-btn:active{transform:scale(.97);}

.splash-inner > *{
  opacity:0;
  transform:translateY(10px);
  animation:fadeUp .6s ease forwards;
}
.emblem{animation-delay:.05s;}
.splash-eyebrow{animation-delay:.18s;}
.splash-welcome{animation-delay:.30s;}
.splash-divider{animation-delay:.42s;}
.splash-sub{animation-delay:.5s;}
.enter-btn{animation-delay:.62s;}
@keyframes fadeUp{
  to{opacity:1; transform:translateY(0);}
}

/* ---------- app shell ---------- */
.app{max-width:560px;margin:0 auto;padding-bottom:56px;}

.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:var(--cream);
  border-bottom:1px solid var(--line);
  transition:box-shadow .25s ease;
}
.topbar.scrolled{box-shadow:0 6px 16px rgba(58,38,32,.08);}
.topbar-logo{width:38px;height:38px;object-fit:contain;transition:transform .4s ease;}
.topbar.scrolled .topbar-logo{transform:scale(.86);}
.topbar-text{display:flex;flex-direction:column;line-height:1.1;}
.topbar-name{font-family:'Aref Ruqaa',serif;font-weight:700;font-size:22px;color:var(--crimson-deep);}
.topbar-name-en{font-size:10px;letter-spacing:.14em;color:var(--ink-soft);}

.chips{
  position:sticky;top:66px;z-index:19;
  display:flex;gap:8px;overflow-x:auto;
  padding:12px 20px;
  background:var(--cream);
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;
  padding:8px 18px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink-soft);
  font-size:13.5px;
  font-weight:500;
  white-space:nowrap;
  cursor:pointer;
  transition:background .25s ease, color .25s ease, border-color .25s ease, transform .15s ease;
}
.chip:active{transform:scale(.94);}
.chip.active{
  background:var(--crimson);
  border-color:var(--crimson);
  color:var(--paper);
  font-weight:700;
}

main{padding:6px 20px 0;}

.category{padding-top:30px;}
.category-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:4px;
}
.category-title{
  font-family:'Aref Ruqaa',serif;
  font-weight:700;
  font-size:24px;
  color:var(--crimson-deep);
}
.category-title-en{
  font-size:11px;
  color:var(--ink-soft);
  letter-spacing:.1em;
}
.category .crown{margin:8px 0 16px;}

.reveal{
  opacity:0;
  transform:translateY(16px);
  transition:opacity .55s ease, transform .55s ease;
}
.reveal.in{opacity:1; transform:translateY(0);}

.item{
  display:flex;align-items:center;gap:16px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
  transition:transform .15s ease;
}
.item:active{transform:scale(.985);}
.item:last-child{border-bottom:none;}
.item-photo{
  width:88px;height:88px;flex:0 0 auto;
  border-radius:16px;
  overflow:hidden;
  background:linear-gradient(100deg, var(--paper) 30%, var(--cream-deep) 50%, var(--paper) 70%);
  background-size:200% 100%;
  animation:shimmer 1.6s infinite linear;
  border:1px solid var(--line);
  box-shadow:0 4px 10px rgba(58,38,32,.08);
}
@keyframes shimmer{
  from{background-position:200% 0;}
  to{background-position:-200% 0;}
}
.item-photo img{
  width:100%;height:100%;object-fit:cover;
  opacity:0;
  transform:scale(1.18);
  transition:opacity .6s ease, transform 1.1s cubic-bezier(.22,.68,.15,1);
}
.item-photo img.loaded{opacity:1; transform:scale(1);}
.item-photo:has(img.loaded){animation:none; background:var(--paper);}
.item:active .item-photo img{transform:scale(1.08) !important; transition-duration:.25s;}

/* Featured hero cards (New section) */
.item-hero{
  flex-direction:column;
  align-items:stretch;
  gap:0;
  padding:0 0 16px;
}
.item-hero .item-photo{
  width:100%;height:190px;
  border-radius:18px;
  margin-bottom:12px;
}
.item-hero .item-photo img{
  animation:kenburns 9s ease-in-out infinite alternate;
}
.item-hero.reveal.in .item-photo img.loaded{transform:scale(1);}
@keyframes kenburns{
  from{transform:scale(1);}
  to{transform:scale(1.09) translate(-1.5%, -1%);}
}
.item-hero .item-text{display:flex;align-items:baseline;justify-content:space-between;width:100%;}
.item-hero .item-name{font-size:16.5px;}
.item-hero .item-price{margin-top:2px;}
.item-text{flex:1 1 auto;min-width:0;}
.item-name{font-size:15.5px;font-weight:700;color:var(--ink);}
.item-name-en{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
.item-price{
  flex:0 0 auto;
  display:flex;align-items:baseline;gap:3px;
  font-weight:800;font-size:16px;
  color:var(--crimson-deep);
}
.item-price small{font-size:10.5px;font-weight:600;color:var(--ink-soft);}

.item.sold-out{opacity:.42;}
.item.sold-out .item-photo{filter:grayscale(1);}
.item.sold-out .item-price::after{
  content:"غير متوفر";
  font-size:10px;font-weight:700;color:var(--ink-soft);
  margin-inline-start:4px;
}

.footer{
  text-align:center;
  padding:38px 20px 10px;
}
.qr-toggle{
  appearance:none;border:1px solid var(--line);
  background:var(--paper);
  color:var(--crimson-deep);
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:13.5px;
  padding:11px 26px;border-radius:999px;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .2s ease;
}
.qr-toggle:active{transform:scale(.95);}
.footer-note{
  margin:16px 0 0;
  font-family:'Aref Ruqaa',serif;
  color:var(--ink-soft);
  font-size:14px;
}

/* ---------- qr modal ---------- */
.qr-modal{
  position:fixed;inset:0;z-index:60;
  background:rgba(35,20,16,.55);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  opacity:0;visibility:hidden;
  transition:opacity .25s ease, visibility .25s ease;
}
.qr-modal.show{opacity:1;visibility:visible;}
.qr-modal.show .qr-card{transform:scale(1);}
.qr-card{
  background:var(--paper);
  border-radius:22px;
  padding:28px 26px 22px;
  text-align:center;
  max-width:280px;
  box-shadow:var(--shadow);
  transform:scale(.92);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1);
}
.qr-card-logo{width:34px;height:34px;object-fit:contain;margin:0 auto 10px;}
#qrcode{
  display:flex;justify-content:center;
  margin:6px auto 14px;
  padding:10px;
  background:#fff;
  border-radius:12px;
}
.qr-card-title{font-size:13px;color:var(--ink-soft);margin:0 0 16px;}
.qr-close{
  appearance:none;border:none;background:var(--crimson);
  color:var(--paper);font-weight:700;font-size:13.5px;
  padding:9px 24px;border-radius:999px;cursor:pointer;
}

@media (min-width:600px){
  .splash-welcome{font-size:64px;}
}

</style>
</head>
<body>

<div id="splash" class="splash">
  <div class="splash-frame">
    <div class="splash-rule top">
      <span class="line"></span>
      <span class="rule-label">بيكوك</span>
    </div>

    <div class="splash-inner">
      <div class="emblem">
        <img class="splash-logo" src="" data-img="logo_transparent" alt="بيكوك">
      </div>
      <p class="splash-eyebrow">أهلاً وسهلاً</p>
      <h1 class="splash-welcome">عدّه بيتك</h1>
      <span class="splash-divider"></span>
      <p class="splash-sub">محمصة ومقهى بيكوك</p>
      <button class="enter-btn" id="enterBtn">القائمة</button>
    </div>

    <div class="splash-rule bottom">
      <span class="rule-label">Peacock Roastery &amp; Café</span>
      <span class="line"></span>
    </div>
  </div>
</div>

<div id="app" class="app">

  <header class="topbar">
    <img class="topbar-logo" src="" data-img="logo_transparent" alt="بيكوك">
    <div class="topbar-text">
      <span class="topbar-name">بيكوك</span>
      <span class="topbar-name-en">Peacock</span>
    </div>
  </header>

  <nav class="chips" id="chips"></nav>

  <main id="menuMain"></main>

  <footer class="footer">
    <button class="qr-toggle" id="qrToggle">باركود القائمة</button>
    <p class="footer-note">بيكوك — عدّه بيتك</p>
  </footer>

</div>

<div class="qr-modal" id="qrModal">
  <div class="qr-card">
    <img class="qr-card-logo" src="" data-img="logo_transparent" alt="">
    <div id="qrcode"></div>
    <p class="qr-card-title">امسح لعرض قائمة بيكوك</p>
    <button class="qr-close" id="qrClose">إغلاق</button>
  </div>
</div>

      document.getElementById('cat-'+cat.id).scrollIntoView({behavior:'smooth', block:'start'});

    chips.appendChild(chip);

    var section = document.createElement('section');
    section.className = 'category';
    section.id = 'cat-'+cat.id;

    var head = document.createElement('div');
    head.className = 'category-head reveal';
    head.innerHTML = '<span class="category-title">'+cat.title_ar+'</span><span class="category-title-en">'+cat.title_en+'</span>';
    section.appendChild(head);

    var crown = document.createElement('div');
    crown.className = 'crown reveal';
    crown.innerHTML = '<span></span><span></span><span></span><span></span><span></span>';
    section.appendChild(crown);

    cat.items.forEach(function(item){
      var row = document.createElement('div');
      var img = (IMAGES[item.img]) ? IMAGES[item.img] : '';
      row.className = 'item reveal';
      row.innerHTML =
        '<div class="item-photo"><img src="'+img+'" alt="'+item.ar+'" loading="lazy" onload="this.classList.add(\'loaded\')"></div>'+
        '<div class="item-text"><div class="item-name">'+item.ar+'</div><div class="item-name-en">'+item.en+'</div></div>'+
        '<div class="item-price">'+item.price+'<small>ر.س</small></div>';
      section.appendChild(row);
    });

    main.appendChild(section);
  });

  // reveal-on-scroll with gentle stagger
  var revealEls = Array.from(document.querySelectorAll('.reveal'));
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry, i){
        if(entry.isIntersecting){
          var el = entry.target;
          var delay = Math.min(i, 5) * 60;
          setTimeout(function(){ el.classList.add('in'); }, delay);
          io.unobserve(el);
        }
      });
    }, {threshold:0.12, rootMargin:'0px 0px -40px 0px'});
    revealEls.forEach(function(el){ io.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add('in'); });
  }

  // topbar shadow on scroll
  var topbar = document.querySelector('.topbar');
  function updateTopbar(){
    topbar.classList.toggle('scrolled', window.scrollY > 8);
  }
  window.addEventListener('scroll', updateTopbar, {passive:true});
  updateTopbar();

  // active chip on scroll
  var chipEls = Array.from(chips.children);
  var sections = MENU.map(function(c){ return document.getElementById('cat-'+c.id); });
  function updateActive(){
    var pos = window.scrollY + 140;
    var idx = 0;
    sections.forEach(function(sec, i){ if(sec.offsetTop <= pos) idx = i; });
    chipEls.forEach(function(c,i){ c.classList.toggle('active', i===idx); });
  }
  window.addEventListener('scroll', updateActive, {passive:true});
  updateActive();

  // splash
  var splash = document.getElementById('splash');
  document.getElementById('enterBtn').addEventListener('click', function(){
    splash.classList.add('hide');
  });

  // qr modal
  var qrModal = document.getElementById('qrModal');
  document.getElementById('qrToggle').addEventListener('click', function(){
    qrModal.classList.add('show');
  });
  document.getElementById('qrClose').addEventListener('click', function(){
    qrModal.classList.remove('show');
  });
  qrModal.addEventListener('click', function(e){
    if(e.target === qrModal) qrModal.classList.remove('show');
  });

  try{
    if(window.QRCode){
      new QRCode(document.getElementById('qrcode'), {
        text: window.location.href,
        width: 168,
        height: 168,
        colorDark: '#3A2620',
        colorLight: '#ffffff'
      });
    }
  }catch(e){ console.warn('QR generation failed', e); }
});

</script>
</body>
</html>
